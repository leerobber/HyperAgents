[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperagents"
version = "0.1.0"
description = "HyperAgents — genome-driven multi-agent evolution on sovereign-core-rs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2"]
rust = ["sovereign-core-rs>=0.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hyper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
